assemble:
    -   fromTask: bootJar
liferay-aihub-multi-agents-etc-spring-boot-oahs:
    .serviceAddress: liferay-aihub-multi-agents-etc-spring-boot:58082
    .serviceScheme: http
    name: Liferay AI Hub Multi Agents Etc Spring Boot OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.Workflow.everything
        -   c_taskresult.everything
    type: oAuthApplicationHeadlessServer
liferay-aihub-multi-agents-etc-spring-boot-oaua:
    .serviceAddress: liferay-aihub-multi-agents-etc-spring-boot:58082
    .serviceScheme: http
    name: Liferay AI Hub Multi Agents Etc Spring Boot OAuth Application User Agent
    type: oAuthApplicationUserAgent
liferay-aihub-multi-agents-etc-spring-boot-object-action-expert-router:
    name: Liferay AI Hub Multi Agents Etc Spring Boot Object Action Expert Router
    oAuth2ApplicationExternalReferenceCode: liferay-aihub-multi-agents-etc-spring-boot-oaua
    resourcePath: /object/action/expert-router
    type: objectAction
liferay-aihub-multi-agents-etc-spring-boot-object-action-novel-creator:
    name: Liferay AI Hub Multi Agents Etc Spring Boot Object Action Novel Creator
    oAuth2ApplicationExternalReferenceCode: liferay-aihub-multi-agents-etc-spring-boot-oaua
    resourcePath: /object/action/novel-creator
    type: objectAction
liferay-aihub-multi-agents-etc-spring-boot-workflow-action-expert-request-task-result:
    name: Liferay AI Hub Multi Agents Etc Spring Boot Workflow Action Expert Request Task Result
    oAuth2ApplicationExternalReferenceCode: liferay-aihub-multi-agents-etc-spring-boot-oaua
    resourcePath: /workflow/action/expert-request-task-result
    type: workflowAction
liferay-aihub-multi-agents-etc-spring-boot-workflow-action-task-result:
    name: Liferay AI Hub Multi Agents Etc Spring Boot Workflow Action Task Result
    oAuth2ApplicationExternalReferenceCode: liferay-aihub-multi-agents-etc-spring-boot-oaua
    resourcePath: /workflow/action/task-result
    type: workflowAction