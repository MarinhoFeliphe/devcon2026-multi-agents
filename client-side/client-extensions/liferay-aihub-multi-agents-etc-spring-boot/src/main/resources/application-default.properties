com.liferay.lxc.dxp.domains=localhost:8080
com.liferay.lxc.dxp.mainDomain=localhost:8080
com.liferay.lxc.dxp.server.protocol=http

#
# OAuth
#

liferay-aihub-multi-agents-etc-spring-boot-oahs.oauth2.headless.server.client.secret=${LIFERAY_AIHUB_MULTI_AGENTS_ETC_SPRING_BOOT_OAHS_CLIENT_SECRET:myfancypassword}

