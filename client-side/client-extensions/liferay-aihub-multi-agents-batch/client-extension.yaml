assemble:
    -   from: batch
        into: batch
liferay-aihub-multi-agents-batch:
    name: Liferay AI Hub Multi Agents Batch
    oAuthApplicationHeadlessServer: liferay-aihub-multi-agents-batch-oahs
    type: batch
liferay-aihub-multi-agents-batch-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay AI Hub Multi Agents OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.Workflow.everything
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer